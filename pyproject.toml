[project]
name = "autobuilder"
version = "0.1.0"
description = "Path of Exile 1 build analyzer on top of the installed Path of Building"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Pinned; each version was at least two weeks old when chosen (task 104, 2026-10-27). Install:
#   python -m venv .venv && .venv\Scripts\python -m pip install --group dev
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "vulture==2.16",
    "pylint==4.1.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Only new code is checked (decision 006); the frozen first app and its tests are not.
extend-exclude = ["engine", "gui", "tests/*.py", "tests/fixtures", "tools/run_tests.py", "tools/hooks",
                  "mechanics", "docs", "tasks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF", "S", "T20", "TID", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"tools/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["autobuilder"]

[tool.pytest.ini_options]
testpaths = ["tests/autobuilder", "tests/architecture", "tests/checks"]
pythonpath = ["src", "tools"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "pob: boots Path of Building (needs the PoB install)",
    "owner: reads the owner's builds folder",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["src"]

[tool.importlinter]
root_package = "autobuilder"

[[tool.importlinter.contracts]]
name = "Rows point down: app > compare > analysis | intake > pob"
type = "layers"
layers = [
    "autobuilder.app",
    "autobuilder.compare",
    "autobuilder.analysis | autobuilder.intake",
    "autobuilder.pob",
]

[[tool.importlinter.contracts]]
name = "The leaves import nothing else of the app"
type = "forbidden"
source_modules = ["autobuilder.errors", "autobuilder.progress"]
forbidden_modules = ["autobuilder.app", "autobuilder.compare", "autobuilder.analysis", "autobuilder.intake",
                     "autobuilder.pob"]
