<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-token" content="__API_TOKEN__">
<title>PoB Autobuilder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c0a;
    --bg-raised: #17140f;
    --bg-sunk: #0a0907;
    --line: #2b251c;
    --line-strong: #40372a;
    --text: #ebe2d1;
    --text-dim: #9d927f;
    --text-faint: #6b6253;
    --gold: #c9a45c;
    --gold-bright: #e6c67e;
    --gain: #8fcf86;
    --loss: #e5826a;
    --warn: #e0b04f;
    --font-display: "Cinzel", Georgia, serif;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --radius-s: 4px;
    --radius-m: 8px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #2a1f12 0%, transparent 60%), var(--bg);
    color: var(--text); font: 14px/1.5 var(--font-body); font-variant-numeric: tabular-nums;
    display: grid; grid-template-columns: 300px 1fr; overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- sidebar ---- */
  aside { border-right: 1px solid var(--line); background: var(--bg-sunk); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  .brand h1 { font: 700 18px/1.1 var(--font-display); letter-spacing: .08em; margin: 0; color: var(--gold-bright); }
  .brand p { margin: 6px 0 0; color: var(--text-faint); font-size: 12px; }
  .search { margin: 14px 16px 8px; padding: 9px 12px; width: calc(100% - 32px); background: var(--bg-raised);
    border: 1px solid var(--line); border-radius: var(--radius-m); }
  .search::placeholder { color: var(--text-faint); }
  .toggle { display: flex; gap: 8px; align-items: center; padding: 4px 18px 12px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .builds { overflow-y: auto; padding: 0 8px 16px; flex: 1; border-top: 1px solid var(--line); }
  .settings { display: grid; gap: 8px; padding: 0 16px 12px; font-size: 12px; color: var(--text-dim); }
  .settings label:not(.toggle) { display: grid; gap: 4px; }
  .settings select, .settings input:not([type]) { background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: var(--radius-s); padding: 6px 8px; }
  .settings .toggle { padding: 0; }
  .ghost { background: none; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 6px; cursor: pointer; color: var(--gold); }
  .ghost:disabled { opacity: .4; cursor: default; }
  .folder { color: var(--text-faint); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 14px 10px 4px; }
  .build-btn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px;
    border-radius: var(--radius-s); color: var(--text-dim); cursor: pointer; transition: background .15s, color .15s; }
  .build-btn:hover { background: var(--bg-raised); color: var(--text); }
  .build-btn[aria-current="true"] { background: #2a2116; color: var(--gold-bright); box-shadow: inset 2px 0 0 var(--gold); }

  /* ---- main ---- */
  main { overflow-y: auto; min-height: 0; padding: 36px 48px 120px; }
  .empty { height: 70vh; display: grid; place-content: center; text-align: center; color: var(--text-faint); }
  .empty h2 { font: 500 28px var(--font-display); color: var(--text-dim); margin: 0 0 8px; }

  .progress { max-width: 520px; margin: 18vh auto 0; text-align: center; }
  .progress h2 { font: 500 22px var(--font-display); margin: 0 0 6px; }
  .progress p { color: var(--gold); margin: 0 0 22px; min-height: 1.5em; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar::after { content: ""; display: block; height: 100%; width: 35%; background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: sweep 1.4s var(--ease) infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  header.build { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
  header.build h2 { font: 700 34px/1.05 var(--font-display); margin: 0; letter-spacing: .02em; }
  header.build .meta { color: var(--text-dim); margin-top: 8px; }
  .chip { display: inline-block; padding: 2px 9px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; color: var(--text-dim); }
  .chip.gold { border-color: #5c4a2a; color: var(--gold-bright); }

  .stats { display: grid; grid-template-columns: 1.6fr repeat(var(--kpis, 3), 1fr); border: 1px solid var(--line); border-radius: var(--radius-m);
    background: var(--bg-raised); margin-bottom: 18px; overflow: hidden; }
  .stat { padding: 16px 20px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .label { color: var(--text-faint); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .stat .value.neg { color: var(--loss); }
  .stat:first-child .value { font: 700 34px/1.1 var(--font-display); color: var(--gold-bright); }
  .breakdown { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); font-size: 12px; color: var(--text-dim); }
  .breakdown li { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
  .breakdown li span:last-child { color: var(--text); white-space: nowrap; }

  .rules { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--text-dim); font-size: 13px; margin-bottom: 36px; }
  .alert { border: 1px solid #5a3a26; background: #24150e; color: var(--loss); padding: 10px 14px; border-radius: var(--radius-m); margin-bottom: 18px; }
  .alert.unob .row { background: var(--bg-raised); color: var(--text); }
  .alert.unob .row:first-of-type { margin-top: 10px; }
  .warn { color: var(--warn); }
  .notsummed { margin: -8px 0 18px; font-size: 12px; }
  .notsummed details.finding { margin: 0; }
  .notsummed .finding-list > div { padding: 3px 0; }

  section { margin-bottom: 40px; }
  section > h3 { font: 500 20px var(--font-display); margin: 0 0 4px; letter-spacing: .03em; }
  section > .sub { color: var(--text-faint); font-size: 13px; margin: 0 0 14px; }
  .group-title { color: var(--gold); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 20px 0 8px; }

  .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--bg-raised); margin-bottom: 6px;
    cursor: pointer; transition: border-color .15s, transform .2s var(--ease), background .15s; }
  .row:hover { border-color: var(--line-strong); }
  .row.selected { border-color: var(--gold); background: #1f1911; }
  .row:active { transform: scale(.995); }
  .row.disabled { cursor: default; opacity: .55; }
  .row input { accent-color: var(--gold); width: 16px; height: 16px; margin-top: 3px; }
  .row .title { font-weight: 500; }
  .row .title .arrow { color: var(--text-faint); margin: 0 6px; }
  .row .detail { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; }
  .row .detail div { margin-top: 2px; }
  .row .reason { color: var(--loss); font-size: 12.5px; margin-top: 4px; }
  .dims { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .dim { font-size: 12px; padding: 2px 8px; border-radius: var(--radius-s); background: var(--bg-sunk); color: var(--text-dim); white-space: nowrap; }
  .dim.up { color: var(--gain); }
  .dim.down { color: var(--loss); }

  details.finding { border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--bg-raised); margin-bottom: 8px; }
  details.finding summary { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; list-style: none; }
  details.finding summary::-webkit-details-marker { display: none; }
  details.finding summary .count { color: var(--gold); }
  details.finding[open] summary { border-bottom: 1px solid var(--line); }
  .finding-list { padding: 6px 16px 12px; }
  .finding-item { display: grid; grid-template-columns: 110px 220px 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .finding-item:last-child { border-bottom: 0; }
  .finding-item .why { color: var(--text-faint); }
  .muted { color: var(--text-faint); }

  .actionbar { position: fixed; left: 300px; right: 0; bottom: 0; padding: 14px 48px; background: linear-gradient(transparent, var(--bg) 35%);
    display: flex; justify-content: flex-end; align-items: center; gap: 16px; pointer-events: none; }
  .actionbar > * { pointer-events: auto; }
  .primary { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a1208; border: 0; font-weight: 600;
    padding: 11px 22px; border-radius: var(--radius-m); cursor: pointer; box-shadow: 0 6px 24px -8px #c9a45c80;
    transition: transform .2s var(--ease), filter .15s; }
  .primary:hover { filter: brightness(1.06); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .result { border: 1px solid #4b5a32; background: #141a0f; border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 24px; }
  .result.bad { border-color: #5a3a26; background: #24150e; }
  .result code { color: var(--gold-bright); word-break: break-all; }
  .reserve { border: 1px solid #5c4a2a; background: #1d160c; border-radius: var(--radius-m); padding: 16px 18px; margin-bottom: 24px; }
  .reserve h3 { font: 500 17px var(--font-display); margin: 0 0 4px; }
  .reserve .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 12px; }
  .reserve-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; margin-bottom: 12px; }
  .reserve-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-s);
    background: var(--bg-raised); cursor: pointer; }
  .reserve-item input { accent-color: var(--gold); }
  .reserve-item .amt { margin-left: auto; color: var(--text-dim); font-size: 12px; }
  .reserve-total { font-weight: 600; }
  .reserve-total.over { color: var(--loss); }
  .reserve-total.ok { color: var(--gain); }

  /* ---- guide check ---- */
  .gnav { margin: 12px 16px 0; width: calc(100% - 32px); border-color: var(--gold); text-align: left; padding: 8px 12px; }
  .gnav[aria-current="true"] { background: #2a2116; color: var(--gold-bright); }
  .gnote { margin: 8px 16px 12px; color: var(--text-faint); font-size: 12px; }
  .gview { max-width: 1000px; }
  .gview h2.gtitle { font: 700 30px/1.1 var(--font-display); margin: 0 0 6px; }
  .gview .lead { color: var(--text-dim); margin: 0 0 22px; }
  .gform { display: grid; gap: 14px; max-width: 720px; }
  .gform label { display: grid; gap: 4px; color: var(--text-dim); font-size: 12px; }
  .gform input, .gform select { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 8px 10px; color: var(--text); }
  .gform .invalid { border-color: var(--loss); }
  .ferror { color: var(--loss); font-size: 12.5px; margin: 0; }
  .ferror:empty, .reason:empty { display: none; }
  .gstrip { color: var(--text-dim); font-size: 13px; margin: 0 0 14px; }
  .gbanner { border: 1px solid var(--warn); border-radius: var(--radius-s); padding: 6px 12px; margin-bottom: 6px; font-size: 13px; }
  .gsummary { margin: 14px 0 18px; font-weight: 500; }
  .gprogress { margin-top: 12vh; }
  .gstages { list-style: none; margin: 0 0 18px; padding: 0; text-align: left; display: inline-block; }
  .gstages li { padding: 2px 0; color: var(--text-faint); }
  .gstages li.done { color: var(--text-dim); }
  .gstages li.now { color: var(--text); }
  .gstages .mark { display: inline-block; width: 22px; color: var(--gold); }
  .gstages .now .mark { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .bar.det::after { display: none; }
  .bar > span { display: none; height: 100%; background: var(--gold); }
  .bar.det > span { display: block; }
  .sr { position: absolute; left: -9999px; }
  .ggroup { border: 1px solid var(--line); border-radius: var(--radius-m); margin-bottom: 14px; background: var(--bg-sunk); }
  .ggroup > summary { padding: 12px 16px; cursor: pointer; font: 500 18px var(--font-display); }
  .ggroup-body { padding: 4px 14px 12px; }
  .ggroup .intro { color: var(--text-dim); font-size: 13px; margin: 0 0 10px; }
  .gtools { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--text-dim); }
  .gtools label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .gfilter[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-bright); cursor: pointer; }
  .gfilter { background: none; cursor: pointer; }
  ul.glist { list-style: none; margin: 0; padding: 0; }
  .row.grow { cursor: default; }
  .row.grow .lock { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
  .row.grow .lockreason { color: var(--loss); font-weight: 600; }
  .chip.ok { border-color: #4b5a32; color: var(--gain); }
  .chip.warn { border-color: #5c4a2a; color: var(--warn); }
  .chip.bad { border-color: #5a3a26; color: var(--loss); }
  .row .chip { margin-left: 4px; }
  .gnums { display: grid; gap: 2px; font-size: 12.5px; min-width: 250px; }
  .nrow { display: grid; grid-template-columns: 62px 78px 1fr; gap: 6px; align-items: baseline; }
  .nlabel { color: var(--text-faint); }
  .nval.up { color: var(--gain); } .nval.down { color: var(--loss); } .nval.flat { color: var(--text-faint); }
  .nstrong { font-weight: 700; }
  .nfrom { color: var(--text-faint); font-size: 11.5px; }
  .gbreak { margin-top: 6px; font-size: 12px; }
  .gbreak summary { cursor: pointer; color: var(--gold); }
  .gbreak table { border-collapse: collapse; margin-top: 4px; }
  .gbreak td, .gbreak th { padding: 1px 12px 1px 0; text-align: left; color: var(--text-dim); font-weight: 400; }
  .gbar { position: sticky; bottom: 0; z-index: 5; margin-top: 24px; padding: 12px 16px; background: var(--bg-raised);
    border: 1px solid var(--line-strong); border-radius: var(--radius-m); display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .gbar.amber { border-color: var(--warn); }
  .gbar-text > div { margin: 2px 0; }
  .gbar .m { margin-right: 12px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; cursor: pointer; }
  .gpanel { max-width: 640px; }
  .gpanel .btns { margin-top: 12px; display: flex; gap: 10px; }
  .gpanel .ghost { padding: 6px 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; overflow: auto; }
    aside { max-height: 40vh; }
    main { padding: 24px 16px 120px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .actionbar { left: 0; padding: 14px 16px; }
    .finding-item { grid-template-columns: 1fr; gap: 2px; }
    .row.grow { grid-template-columns: 26px 1fr; }
    .row.grow .gnums { grid-column: 2; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>PoB AUTOBUILDER</h1>
    <p>Optimize skills and tree. Gear stays fixed.</p>
  </div>
  <input class="search" id="search" placeholder="Search builds…" aria-label="Search builds">
  <div class="settings">
    <label>Scenario <select id="scenario"></select></label>
    <label>Leave out skills <input id="leaveout" placeholder="e.g. Aspect of the Brine King"></label>
    <label class="toggle"><input type="checkbox" id="drafts" checked> Include draft vault rules</label>
    <button class="ghost" id="rerun" disabled>Re-run audit</button>
  </div>
  <button class="ghost gnav" id="gnav" hidden>Guide check</button>
  <p class="gnote" id="gnote" hidden></p>
  <nav class="builds" id="builds" aria-label="Builds"></nav>
</aside>
<main id="main">
  <div class="empty"><div><h2>Pick a build</h2><div>Choose a build from your PoB folder to audit it.</div></div></div>
</main>
<div class="actionbar" id="actionbar" hidden>
  <span class="muted" id="selcount"></span>
  <button class="primary" id="apply" disabled>Apply &amp; save to PoB</button>
</div>

<script>
const state = { builds: [], settings: {}, current: null, job: null, report: null, selected: new Set() };
const $ = (id) => document.getElementById(id);

// DOM builder: text is always set via textContent (build data is untrusted).
function h(tag, attrs = {}, ...children) {
  if (!tag) return null;
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

function trunc(v, d = 0) {
  return Math.trunc(Number((v * 10 ** d).toFixed(6))) / 10 ** d;
}

function fmtNum(v, d = 0, { sign = false, group = true, unit = "" } = {}) {
  if (!Number.isFinite(v)) return "n/a";
  const raw = trunc(v, d);
  const t = raw === 0 ? 0 : raw;
  const formatted = t.toLocaleString("en-US", {
    minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: group,
  });
  return (sign && t > 0 ? "+" : "") + formatted + unit;
}

const fmtBig = (n) => !Number.isFinite(n) ? "n/a"
  : n >= 1e6 ? fmtNum(n / 1e6, 2) + "M"
    : n >= 1e3 ? fmtNum(n / 1e3, 1) + "k" : fmtNum(n, 0);
const fmtPct = (v) => Number.isFinite(v) ? fmtNum(v, 1, { sign: true }) + "%" : "n/a";
const fmtMana = (v) => typeof v === "number" && Number.isFinite(v) ? fmtNum(v, 0, { sign: true }) + "/s" : "";
const fmtMargin = (v) => Number.isFinite(v) ? fmtNum(v, 1, { sign: true }) + "/s" : "n/a";
const fmtRate = (v) => Number.isFinite(v) ? fmtNum(v, 2) + "/s" : "n/a";

function unverifiedNote(resource) {
  const costs = state.report && state.report.base && Array.isArray(state.report.base.costs)
    ? state.report.base.costs : [];
  const cost = costs.find((entry) => entry && entry.resource === resource);
  return cost && typeof cost.unverified === "string" ? cost.unverified : "";
}

function withEsUnverified(line) {
  const note = unverifiedNote("ES");
  return note && /\bES\b|energy shield/i.test(String(line)) ? `${line} [${note}]` : line;
}

function skillsLine(skills) {
  if (!skills || !skills.length) return "";
  const contribution = (s) => Number.isFinite(s.contribution) ? s.contribution : (s.dps || 0) * (s.count || 1);
  const dps = skills.filter((s) => contribution(s) > 0).map((s) => {
    const details = s.part == null ? `x${s.count}` : `${s.part}, x${s.count}`;
    return `${s.name} ${fmtNum(contribution(s) / 1e6, 2)}M (${details})`;
  }).join(" + ");
  const triggers = skills.filter((s) => s.trigger != null).map((s) => {
    const cap = s.trigger.cap;
    return `${s.name} ${fmtRate(s.trigger.rate)}`
      + (Number.isFinite(cap) ? ` of ${fmtRate(cap)} cap` : ", no cap");
  }).join("; ");
  return dps + (dps && triggers ? "; " : "") + triggers;
}

function skillsWhy(skills) {
  if (!skills || !skills.length) return [];
  return skills.filter((s) => s.trigger != null && s.trigger.why != null).map((s) => s.trigger.why);
}

function skillLabel(s) {
  s = s && typeof s === "object" ? s : {};
  const parts = [];
  if (typeof s.part === "string" && s.part.trim()) parts.push(s.part);
  if (Number.isFinite(s.projectiles)) parts.push(`${fmtNum(s.projectiles, 0)} proj`);
  return (typeof s.name === "string" ? s.name : "") + (parts.length ? ` (${parts.join(", ")})` : "");
}

function skillDeltaLine(s) {
  return `${skillLabel(s)} ${fmtPct(s && s.pct)} (${fmtNum(s && s.from / 1e6, 2)}M -> ${fmtNum(s && s.to / 1e6, 2)}M)`;
}

function skillDelta(dims) {
  const skills = dims && Array.isArray(dims.skills) ? dims.skills : [];
  return skills.filter((s) => s && s.pct != null).slice(0, 3).map(skillDeltaLine).join(", ");
}

function partsLine(dims) {
  const parts = dims && Array.isArray(dims.parts) ? dims.parts : [];
  if (!parts.length) return null;
  const first = parts[0] && typeof parts[0] === "object" ? parts[0] : {};
  return h("div", { class: "muted" }, `${typeof first.skill === "string" ? first.skill : ""} parts: `,
    parts.map((value, i) => {
      const part = value && typeof value === "object" ? value : {};
      const name = typeof part.partName === "string" ? part.partName : "";
      const attrs = Number.isFinite(part.dps) && part.dps < 0 ? { class: "warn" } : {};
      return [i ? " | " : null, h("span", attrs, `${name}${part.saved === true ? " (saved)" : ""} ${fmtPct(part.dps)}`)];
    }));
}

async function api(path, body) {
  const token = document.querySelector('meta[name="api-token"]').getAttribute("content");
  const headers = { "X-Api-Token": token };
  const options = { headers };
  if (body) {
    options.method = "POST";
    headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) {
    const error = new Error(data.error || res.statusText);
    error.status = res.status;
    error.kind = data.kind;
    throw error;
  }
  return data;
}

// ---- sidebar -------------------------------------------------------------------------------
async function loadBuilds() {
  const data = await api("/api/builds");
  state.builds = data.builds; state.settings = data.settings || {};
  $("scenario").replaceChildren(...data.scenarios.map((n) => h("option", { value: n, selected: n === data.defaultScenario }, n)));
  state.defaultScenario = data.defaultScenario;
  guideInit(data.guideCheck);
  renderBuilds();
}

function renderBuilds() {
  const q = $("search").value.toLowerCase();
  const byFolder = new Map();
  for (const b of state.builds) {
    if (q && !(b.name + " " + b.folder).toLowerCase().includes(q)) continue;
    if (!byFolder.has(b.folder)) byFolder.set(b.folder, []);
    byFolder.get(b.folder).push(b);
  }
  const folders = [...byFolder.keys()].sort((a, b) => b.localeCompare(a));
  $("builds").replaceChildren(...folders.flatMap((folder) => [
    h("div", { class: "folder" }, folder || "Builds"),
    ...byFolder.get(folder).map((b) => h("button", {
      class: "build-btn", "aria-current": state.current === b.path ? "true" : "false", onclick: () => pickBuild(b.path),
    }, b.name)),
  ]));
}

// ---- audit -----------------------------------------------------------------------------------
function pickBuild(path) {
  // restore what was used last time for this build
  const saved = state.settings[path] || {};
  $("scenario").value = saved.scenario || state.defaultScenario;
  $("leaveout").value = (saved.leaveOut || []).join(", ");
  startAudit(path);
}

async function startAudit(path) {
  $("rerun").disabled = false;
  G.active = false; $("gnav").setAttribute("aria-current", "false");
  state.current = path; state.report = null; state.lastResult = null; state.selected.clear();
  renderBuilds(); $("actionbar").hidden = true;
  renderProgress("Starting…");
  try {
    const leaveOut = $("leaveout").value.split(",").map((x) => x.trim()).filter(Boolean);
    const scenario = $("scenario").value;
    state.settings[path] = { leaveOut, scenario };
    const { jobId } = await api("/api/audit", { build: path, includeDrafts: $("drafts").checked, leaveOut, scenario });
    state.job = jobId;
    poll(jobId);
  } catch (e) { renderError(e.message); }
}

async function poll(jobId) {
  if (state.job !== jobId) return;
  const job = await api("/api/jobs/" + jobId);
  if (job.status === "running") { renderProgress(job.progress); setTimeout(() => poll(jobId), 600); }
  else if (job.status === "error") renderError(job.error);
  else { state.report = job.report; renderReport(); }
}

function renderProgress(label) {
  $("main").replaceChildren(h("div", { class: "progress" },
    h("h2", {}, state.current.split("/").pop().replace(/\.xml$/i, "")), h("p", {}, label), h("div", { class: "bar" })));
}

function renderError(msg) {
  $("main").replaceChildren(h("div", { class: "alert" }, "Audit failed: " + msg));
}

// ---- report ----------------------------------------------------------------------------------
function dimChips(d, opts = {}) {
  d = d && typeof d === "object" ? d : {};
  const cls = (v) => v == null || Math.abs(v) < 0.05 ? "dim" : v > 0 ? "dim up" : "dim down";
  const costs = d.costs && typeof d.costs === "object" ? d.costs : {};
  const costKeys = ["Mana", "Life", "ES"].filter((resource) => costs[resource]
    && typeof costs[resource].from === "number" && typeof costs[resource].to === "number");
  const legacyMana = !costKeys.length && typeof d.manaFrom === "number" && typeof d.manaTo === "number";
  const manaDelta = legacyMana ? d.manaTo - d.manaFrom : 0;
  return h("div", { class: "dims" },
    h("span", { class: cls(d.dps) }, "DPS " + fmtPct(d.dps)),
    h("span", { class: cls(d.ehp) }, "EHP " + fmtPct(d.ehp)),
    opts.physMaxHit ? h("span", { class: cls(d.physMaxHit) }, "Max hit " + fmtPct(d.physMaxHit)) : null,
    ...costKeys.map((resource) => {
      const change = costs[resource], delta = change.to - change.from;
      const fallbackNote = resource === "ES" ? unverifiedNote("ES") : "";
      const note = typeof change.unverified === "string" && change.unverified ? change.unverified : fallbackNote;
      const isUnverified = resource === "ES" && Boolean(change.unverified || fallbackNote);
      return h("span", {
        class: Math.abs(delta) < 0.5 ? "dim" : delta > 0 ? "dim up" : "dim down",
        title: isUnverified ? note || "unverified" : null,
      }, `${resource} margin ${fmtMargin(change.from).replace("/s", "")} -> ${fmtMargin(change.to)}`,
      isUnverified ? h("small", {}, " ⚠ unverified") : null);
    }),
    h(legacyMana ? "span" : null, { class: Math.abs(manaDelta) < 0.5 ? "dim" : manaDelta > 0 ? "dim up" : "dim down" },
      "Mana " + fmtMana(d.manaFrom) + " → " + fmtMana(d.manaTo)),
    ...(d.models || []).map((m) => h("span", { class: m.to > m.from ? "dim up" : m.to < m.from ? "dim down" : "dim",
      title: m.model }, `Hits ${m.from} → ${m.to}`)),
    d.weakens && d.weakens.length ? h("span", { class: "dim down", title: d.weakens.join(", ") },
      "Weakens " + d.weakens.length + " ailment stat" + (d.weakens.length > 1 ? "s" : "")) : null,
    d.loses && d.loses.length ? h("span", { class: "dim down", title: d.loses.join(", ") },
      "Loses " + [...new Set(d.loses.map((k) => k.replace(/Chance(OnHit|OnCrit)?$/, "")))].join(", ")) : null);
}

function suggestionRow(id, title, detailLines, dims, opts = {}) {
  const disabled = id == null;
  const checked = state.selected.has(id);
  detailLines = Array.isArray(detailLines) ? detailLines : [];
  const perSkill = skillDelta(dims);
  const partsEl = partsLine(dims);
  const warnings = (Array.isArray(opts.warn) ? opts.warn : []).map(withEsUnverified);
  const row = h("div", {
    class: "row" + (checked ? " selected" : "") + (disabled ? " disabled" : ""),
    onclick: disabled ? null : () => toggle(id, opts.gem),
  },
    disabled && opts.noCheckbox ? h("span") : h("input", { type: "checkbox", checked, disabled, "aria-label": "Select", tabindex: -1 }),
    h("div", {}, h("div", { class: "title" }, title),
      detailLines.length || perSkill || warnings.length || partsEl ? h("div", { class: "detail" },
        detailLines.map((l) => h("div", {}, l)),
        warnings.map((l) => h("div", { class: "warn" }, l)),
        perSkill ? h("div", { class: "muted" }, perSkill) : null, partsEl) : null,
      opts.reason ? h("div", { class: "reason" }, opts.reason) : null),
    dims && typeof dims === "object" && Object.keys(dims).length ? dimChips(dims, opts) : null);
  row.dataset.id = id ?? "";
  return row;
}

function clearConflicts(gem) {
  const suggestions = (state.report && state.report.suggestions) || [];
  for (const other of [...state.selected]) {
    const o = suggestions[other - 1];
    if (!o) continue;
    const tree = (gem === "__tree__" && o.type === "repath")
      || (gem && gem.startsWith("__mastery__") && o.type === "mastery" && "__mastery__" + o.name === gem);
    if (tree || (gem && (o.name === gem || o.replaced === gem))) state.selected.delete(other);
  }
}

function toggle(id, gem) {
  if (state.selected.has(id)) state.selected.delete(id);
  else {
    clearConflicts(gem);
    state.selected.add(id);
  }
  renderReport();
}

function selectMany(ids, gemFor) {
  const valid = (Array.isArray(ids) ? ids : []).filter((id) => id != null);
  if (valid.length && valid.every((id) => state.selected.has(id))) {
    valid.forEach((id) => state.selected.delete(id));
  } else {
    valid.forEach((id) => {
      const suggestion = state.report && Array.isArray(state.report.suggestions) ? state.report.suggestions[id - 1] : null;
      const mapped = typeof gemFor === "function" ? gemFor(id) : gemFor && gemFor[id];
      const gems = mapped ? [mapped] : suggestion ? [suggestion.name, suggestion.replaced].filter(Boolean) : [];
      gems.forEach(clearConflicts);
      state.selected.add(id);
    });
  }
  if (state.report && state.report.sections && state.report.build) renderReport();
  else updateActionbar();
}

function scenarioMetaText(r) {
  const scenario = r && r.scenario || {};
  const config = scenario.config && typeof scenario.config === "object" ? scenario.config : {};
  const conditional = Array.isArray(scenario.conditional) ? scenario.conditional : [];
  const conditions = conditional.map((entry) => entry && entry.applied
    ? `${entry.var}=${String(entry.value)} (source: ${entry.source || "unknown"})`
    : `${entry && entry.var}=${String(entry && entry.value)} not applied: no source in the build`);
  return `Scenario: ${scenario.name || ""}`
    + (Object.keys(config).length ? ` (${Object.entries(config).map(([k, v]) => k + "=" + v).join(", ")})` : "")
    + (conditions.length ? ` · ${conditions.join(" · ")}` : "");
}

function costTiles(r) {
  const costs = r && r.base && Array.isArray(r.base.costs)
    ? r.base.costs.filter((cost) => cost && typeof cost === "object") : [];
  if (!costs.length) return [kpiTile("Mana margin", fmtMana(r && r.base && r.base.manaMargin),
    r && r.kpiSources && r.kpiSources.manaMargin)];
  const sourceCosts = r && r.kpiSources && Array.isArray(r.kpiSources.costs) ? r.kpiSources.costs : [];
  return costs.map((cost) => {
    const match = sourceCosts.find((entry) => entry && entry.resource === cost.resource);
    const extras = [];
    const warnExtras = [];
    if (Number.isFinite(cost.poolSeconds)) extras.push(`pool lasts ${fmtNum(cost.poolSeconds, 0)} s`);
    if (cost.resource === "ES" && cost.recharge && cost.recharge.text && cost.recharge.text !== "none")
      extras.push("Recharge (not counted): "
        + (Number.isFinite(cost.recharge.perSecond) ? fmtNum(cost.recharge.perSecond, 0, { sign: true }) + "/s" : "n/a")
        + ", only after " + (Number.isFinite(cost.recharge.delay) ? fmtNum(cost.recharge.delay, 2) + " s" : "n/a")
        + " without damage");
    if (cost.resource === "ES" && typeof cost.unverified === "string" && cost.unverified) {
      extras.push(cost.unverified);
      warnExtras.push(cost.unverified);
    }
    return kpiTile(`${cost.resource} margin`, fmtMargin(cost.margin), match && match.sources,
      (v) => Number.isFinite(v) && Math.abs(v) >= 100 ? fmtNum(v, 0) : fmtNum(v, 1),
      { negative: cost.margin < 0, extras, warnExtras });
  });
}

function notSummedBlock(r) {
  const excluded = r && r.costs && Array.isArray(r.costs.excluded) ? r.costs.excluded : [];
  if (!excluded.length) return null;
  return h("div", { class: "notsummed muted" }, h("details", { class: "finding" },
    h("summary", {}, h("span", {}, "Not summed"), h("span", { class: "count" }, excluded.length)),
    h("div", { class: "finding-list" },
      h("div", {}, "Not summed (PoB's rate would overstate what you actually pay):"),
      excluded.map((entry) => {
        const values = entry && entry.value && typeof entry.value === "object" ? Object.entries(entry.value) : [];
        const amount = values.filter(([, value]) => typeof value === "number")
          .map(([resource, value]) => `${resource} ${fmtNum(value, 1)}/s`).join(", ");
        return h("div", {}, `${entry && entry.name || "Unknown"}${entry && entry.group != null ? ` (group ${entry.group})` : ""}: ${amount} - ${entry && entry.reason || ""}`);
      }))));
}

function unobRow(item) {
  const replacement = item && item.replacement;
  const title = [`${item && item.name || "Unknown gem"} ${item && item.level != null ? item.level : "?"}/${item && item.quality != null ? item.quality : "?"}`
    + ` (${item && item.groupLabel || "Unknown group"}): ${item && item.label || ""}`];
  if (replacement) title.push(h("div", {}, `-> ${replacement.with} ${replacement.level}/${replacement.quality}`));
  const details = (item && Array.isArray(item.why) ? item.why : []).map((why) => "Why: " + why);
  if (!replacement && item && item.replacementNote) details.push(item.replacementNote);
  const warnings = (item && Array.isArray(item.breaks) ? item.breaks : []).map((warning) => "⚠ " + warning);
  return suggestionRow(item && item.id, title, details, item && item.dims || {}, {
    gem: item && item.name, warn: warnings, noCheckbox: !item || item.id == null,
  });
}

function unobtainableAlert(r) {
  const section = r && r.sections && r.sections.unobtainable;
  const items = section && Array.isArray(section.items) ? section.items : [];
  if (!items.length) return null;
  const nodes = [
    h("div", { class: "title" }, `Unobtainable or unlisted gems already in your build (${items.length})`),
    h("div", { class: "muted" }, "denied = vault note says it can't be obtained; unlisted = not on poe.ninja, unverified."),
  ];
  nodes.push(...items.map(unobRow));
  const combined = section.combined;
  const ids = combined && Array.isArray(combined.ids) ? combined.ids.filter((id) => id != null) : [];
  if (combined && ids.length > 1) {
    const gems = Object.fromEntries(items.filter((item) => item && item.id != null).map((item) => [item.id, item.name]));
    const checked = ids.every((id) => state.selected.has(id));
    const details = (Array.isArray(combined.why) ? combined.why : []).map((why) => "Why: " + why);
    const warnings = (Array.isArray(combined.breaks) ? combined.breaks : [])
      .map((warning) => withEsUnverified("⚠ " + warning));
    const row = h("div", { class: "row" + (checked ? " selected" : ""), onclick: () => selectMany(ids, gems) },
      h("input", { type: "checkbox", checked, "aria-label": "Select all replacements", tabindex: -1 }),
      h("div", {}, h("div", { class: "title" }, "Take all replacements"),
        details.length || warnings.length ? h("div", { class: "detail" },
          details.map((line) => h("div", {}, line)), warnings.map((line) => h("div", { class: "warn" }, line))) : null),
      combined.dims && typeof combined.dims === "object" && Object.keys(combined.dims).length ? dimChips(combined.dims) : null);
    nodes.push(row);
  }
  return h("div", { class: "alert unob" }, nodes);
}

function gemTitle(name, from, to) {
  return [name + " ", h("span", { class: "muted" }, from), h("span", { class: "arrow" }, "→"), to];
}

function renderReport() {
  const r = state.report, s = r.sections, b = r.build;
  const parts = [];
  const baseSkills = skillsLine(r.base.skills);
  const baseSkillsWhy = skillsWhy(r.base.skills);
  const costKpis = costTiles(r);

  parts.push(h("header", { class: "build" },
    h("div", {}, h("h2", {}, b.buildName),
      h("div", { class: "meta" }, `${b.ascendancy || b.className} · level ${b.level} · skills used together: ${b.skills.join(" + ")}`),
      h("div", { class: "meta" }, scenarioMetaText(r)
        + (r.disabledSkills.length ? ` · left out: ${r.disabledSkills.join(", ")}` : "")),
      h("div", { class: "meta" }, `Analysed file: ${b.file} · saved ${b.savedAt} — save in PoB (Ctrl+S) before auditing`)),
    h("span", { class: "chip gold" }, "League: " + b.league)));

  if (r.dpsMeasure && r.dpsMeasure.warning)
    parts.push(h("div", { class: "alert" }, r.dpsMeasure.warning));

  parts.push(h("div", { class: "stats", style: `--kpis:${Math.max(3, 2 + costKpis.length)}` },
    h("div", { class: "stat" }, h("div", { class: "label" }, r.dpsMeasure && r.dpsMeasure.key === "FullDPS" ? "PoB Full DPS" : "Main skill DPS (CombinedDPS)"),
      h("div", { class: "value" }, fmtBig(r.base.dps)),
      baseSkills ? h("div", { class: "breakdown" }, h("div", {}, baseSkills),
        baseSkillsWhy.map((why) => h("div", { class: "muted" }, why))) : null,
      h("ol", { class: "breakdown" }, (r.dpsBreakdown || []).map((st) =>
        h("li", {}, h("span", {}, st.label), h("span", {}, st.dps == null ? "" : fmtBig(st.dps)))))),
    kpiTile("Total EHP", fmtBig(r.base.ehp), (r.kpiSources || {}).ehp),
    kpiTile("Phys max hit", fmtBig(r.base.physMaxHit), (r.kpiSources || {}).physMaxHit),
    costKpis));

  const notSummed = notSummedBlock(r);
  if (notSummed) parts.push(notSummed);

  const reservePanel = reservationPanel(r);
  if (reservePanel) parts.push(reservePanel);

  if (r.rules.currentViolations.length)
    parts.push(h("div", { class: "alert" }, "Your build already breaks (suggestions are only rejected for new breaks): "
      + r.rules.currentViolations.map(withEsUnverified).join("; ")));
  const unobtainable = unobtainableAlert(r);
  if (unobtainable) parts.push(unobtainable);
  parts.push(h("div", { class: "rules" }, h("span", { class: "chip" }, r.rules.active.length + " vault rules active"),
    (r.models || []).map((m) => h("span", { class: "chip gold", title: "PoB doesn't calculate this; the vault model does" },
      `${m.model}: ${m.multiplier} hits (PoB count ${m.pobCount})`)),
    r.rules.skipped.length ? h("span", {}, "Skipped drafts: " + r.rules.skipped.join(", ")) : null));

  if (state.lastResult) parts.push(state.lastResult);

  // suggestions
  const sugSection = h("section", {}, h("h3", {}, "Suggestions"),
    h("p", { class: "sub" }, "Only changes that pass every rule and are obtainable in " + b.league + ". Select, then apply."));
  sugSection.append(h("div", { class: "group-title" }, "Gem upgrades"));
  if (!s.gems.length) sugSection.append(h("p", { class: "muted" }, "All gems at their best obtainable level/quality."));
  for (const g of s.gems)
    sugSection.append(suggestionRow(g.id, gemTitle(g.gem, g.from, g.to), g.statChanges.map((c) => c.from + "  →  " + c.to), g.dims,
      { gem: g.gem, reason: g.rejected.length ? "Rejected: " + g.rejected[0] : null }));

  sugSection.append(h("div", { class: "group-title" }, "Support gem swaps"),
    h("p", { class: "sub" }, `${s.swaps.tried} tried · ${s.swaps.unobtainable} not in league · ${s.swaps.rejected} break a rule`));
  if (!s.swaps.items.length) sugSection.append(h("p", { class: "muted" }, "No swap beats your current links."));
  for (const w of s.swaps.items)
    sugSection.append(suggestionRow(w.id, gemTitle("", w.replaced, w.with), [], w.dims, { gem: w.replaced }));
  sugSection.append(h("div", { class: "group-title" }, "Passive tree"));
  const rp = s.repath;
  if (rp.status === "found")
    sugSection.append(suggestionRow(rp.id, `Re-path: ${rp.currentPoints} → ${rp.newPoints} points`,
      ["Drop: " + rp.drop.join(", "), "Take: " + (rp.take.join(", ") || "—")], rp.dims, { physMaxHit: true }));
  else sugSection.append(h("p", { class: "muted" }, "Re-path: " + rp.message));
  const tree = s.treeSwaps || { swaps: {}, masteries: [] };
  for (const [objective, label] of [["dps", "DPS"], ["ehp", "defence (EHP)"]]) {
    sugSection.append(h("div", { class: "group-title" }, `Tree swaps for ${label}`),
      h("p", { class: "sub" }, `From PoB's power report (${tree.nodesScored || 0} nodes scored). Pick one tree swap at a time.`));
    const list = (tree.swaps || {})[objective] || [];
    if (!list.length) sugSection.append(h("p", { class: "muted" }, "No swap passes every rule."));
    for (const t of list)
      sugSection.append(suggestionRow(t.id, `Drop ${t.drop} (${t.dropPoints} pts)`,
        ["Take: " + t.take.join(", "),
         ...(t.dropDetails || []).map((d) => "Drop does: " + d),
         ...(t.takeDetails || []).map((d) => "Take does: " + d),
         ...(t.why || []).map((w) => "Why (PoB modifier change): " + w),
         ...(t.warnings || []).map((w) => "⚠ " + w),
         ...(t.unspentPoints ? [`⚠ ${t.unspentPoints} point(s) left unspent`] : [])], t.dims,
        { physMaxHit: true, gem: "__tree__" }));
  }
  sugSection.append(h("div", { class: "group-title" }, "Mastery options"),
    h("p", { class: "sub" }, "Every alternative for your allocated masteries, compared like PoB's mastery popup."));
  if (!(tree.masteries || []).length) sugSection.append(h("p", { class: "muted" }, "Your current mastery choices are the best."));
  for (const m of tree.masteries || [])
    sugSection.append(suggestionRow(m.id, m.mastery, ["From: " + m.from, "To: " + m.to], m.dims, { gem: "__mastery__" + m.mastery }));
  parts.push(sugSection);

  // findings
  const g = s.mods.groups;
  const findings = h("section", {}, h("h3", {}, "Findings"),
    h("p", { class: "sub" }, `${s.mods.checked} gear & flask mod lines checked. Gear is not changed — these are for you to act on.`),
    findingGroup("No effect (rare/magic)", "Nothing changes in PoB — improvement potential if you ever re-craft the item", g.wasted, true),
    findingGroup("Unique lines with no PoB effect", "Part of the item — a drawback, irrelevant here, or something PoB can't measure", g.uniquePackage || []),
    findingGroup("Conditional", "Only work when a condition is on — check PoB's config", g.conditional || []),
    findingGroup("Overcapped", "Individually wasted — test together before rerolling", g.overcapped),
    findingGroup("Can't measure", "PoB can't value these (vault Gap patterns)", g.cantMeasure),
    findingGroup("PoB can't parse", "Unsupported mod lines — vault Gap candidates", g.unparsed),
    branchGroup(s.branches));
  parts.push(findings);

  $("main").replaceChildren(...parts);
  updateActionbar();
}

function findingGroup(title, hint, rows, open = false) {
  return h("details", { class: "finding", open },
    h("summary", {}, h("span", {}, title + " ", h("span", { class: "muted" }, "— " + hint)), h("span", { class: "count" }, rows.length)),
    h("div", { class: "finding-list" }, rows.length ? rows.map((m) => h("div", { class: "finding-item" },
      h("span", { class: "muted" }, m.slot), h("span", {}, m.item), h("span", {}, m.line, m.why ? h("span", { class: "why" }, "  · " + m.why) : null)))
      : h("div", { class: "muted" }, "None")));
}

function branchGroup(rows) {
  return h("details", { class: "finding" },
    h("summary", {}, h("span", {}, "Low-value tree nodes ", h("span", { class: "muted" }, "— under 1% DPS/EHP and safe to remove")), h("span", { class: "count" }, rows.length)),
    h("div", { class: "finding-list" }, rows.length ? rows.map((r) => h("div", { class: "finding-item" },
      h("span", { class: "muted" }, r.points + " pts"), h("span", {}, r.name),
      h("span", { class: "why" }, `DPS ${fmtPct(r.dims.dps)} · EHP ${fmtPct(r.dims.ehp)} if removed`)))
      : h("div", { class: "muted" }, "None")));
}

// When reservation exceeds the pool, ask which reserving skills (auras, heralds, aspects...) are actually run.
function reservationPanel(r) {
  const res = r.reservation;
  if (!res) return null;
  const names = new Set(res.skills.map((s) => s.name));
  const leftOut = new Set(r.disabledSkills || []);
  const isLeftOut = [...leftOut].some((n) => names.has(n));
  if (!res.overReserved && !isLeftOut) return null;

  const boxes = res.skills.map((s) => ({ skill: s, input: h("input", { type: "checkbox", checked: !leftOut.has(s.name) }) }));
  const total = h("span", { class: "reserve-total" });
  const update = () => {
    for (const pool of ["Mana", "Life"]) {
      if (!res.skills.some((s) => s.pool === pool)) continue;
      const used = boxes.filter((b) => b.skill.pool === pool && b.input.checked).reduce((sum, b) => sum + b.skill.amount, 0);
      const max = pool === "Mana" ? res.mana : res.life;
      total.textContent = `${pool}: ${used} / ${max} reserved`;
      total.className = "reserve-total " + (used > max ? "over" : "ok");
    }
  };
  boxes.forEach((b) => b.input.addEventListener("change", update));
  update();

  const rerun = h("button", { class: "primary", onclick: () => {
    const others = $("leaveout").value.split(",").map((x) => x.trim()).filter((x) => x && !names.has(x));
    const off = boxes.filter((b) => !b.input.checked).map((b) => b.skill.name);
    $("leaveout").value = [...others, ...off].join(", ");
    startAudit(state.current);
  } }, "Re-run with this setup");

  return h("div", { class: "reserve" },
    h("h3", {}, res.overReserved ? "Your reservations don't fit — which do you run?" : "Reservation setup"),
    h("p", { class: "sub" }, `In your file, these reserve ${res.skills.reduce((s, x) => s + x.amount, 0)} against a pool of ${res.mana} mana. `
      + "Untick what you don't run in this scenario (e.g. boss-only aspects). The file isn't changed."),
    h("div", { class: "reserve-list" }, boxes.map((b) => h("label", { class: "reserve-item" }, b.input,
      h("span", {}, b.skill.name), h("span", { class: "amt" }, `${b.skill.amount} ${b.skill.pool.toLowerCase()} (${b.skill.percent}%)`)))),
    h("div", { style: "display:flex; gap:16px; align-items:center" }, total, rerun));
}

// ---- guide check -------------------------------------------------------------------------------
// Everything from the guide (names, notes, item names, mod lines) reaches the page through h()/textContent only.
// PoB drops keys and sends inf/NaN as null: every read goes through obj/arr/str and Number.isFinite.
const G = { available: false, active: false, job: null, running: false, report: null, ticked: new Set(), sort: "best",
  filter: "all", seq: 0, timer: null, rowMsg: new Map(), rowEls: new Map(), boxes: new Map(), inputs: { build: "", link: "", guide: "" },
  started: 0, saved: null, preview: null, bar: "idle", saving: false, last: null, groups: {}, groupA: null, barEl: null };
const STAGES = ["Fetching the guide from pobb.in", "Loading both builds in Path of Building", "Testing differences", "Ranking and explaining"];
const TESTING = "Testing differences";
const PREVIEW_DELAY_MS = 500, POLL_MS = 600, SLOW_AFTER_S = 60, ZERO_PCT = 0.1, DASH = "–";
const POBB = /^(?:https?:\/\/)?(?:www\.)?pobb\.in\/(?:pob\/)?[A-Za-z0-9_-]{4,32}\/?$/i;
const TIP = { dps: "PoB Full DPS (all your skills used together)", ehp: "PoB Total EHP",
  mana: "Mana regeneration minus the mana cost per second of the skills you use together.",
  best: "The larger of the DPS gain and the EHP gain." };
const CHIP_CLASS = { "helps": "ok", "trade-off": "warn", "breaks a rule": "bad" };
const GEAR = ["item", "flask", "jewel"], TREE = ["tree-add", "tree-remove"];

const arr = (v) => Array.isArray(v) ? v : [];
const obj = (v) => v && typeof v === "object" && !Array.isArray(v) ? v : {};
const str = (v) => typeof v === "string" ? v : "";
const fin = (v) => Number.isFinite(v) ? v : 0;
const gPct = (v) => Number.isFinite(v) ? fmtNum(v, 1, { sign: true }) + "%" : DASH;
const gBig = (v) => Number.isFinite(v) ? fmtBig(v) : DASH;
const gMargin = (v) => Number.isFinite(v) ? fmtNum(v, 1, { sign: true }) + "/s" : DASH;
const gPlain = (v) => Number.isFinite(v) ? fmtNum(v, 1) : DASH;
const gCell = (v) => typeof v === "string" ? v : Number.isFinite(v) ? (Math.abs(v) >= 1000 ? fmtBig(v) : fmtNum(v, 1)) : DASH;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
function groupOf(row) {
  const c = obj(row).category;
  return GEAR.includes(c) ? "Gear" : TREE.includes(c) ? "Tree" : "Gems & supports";
}

function guideInit(info) {

function openGuide() {
  if (!G.available) return;
  G.active = true; state.job = null; $("actionbar").hidden = true;
  $("gnav").setAttribute("aria-current", "true");

}

// ---- input ---------------------------------------------------------------------------------------
function validLink(v) { return POBB.test(v.trim()); }

function renderGuideInput(errors) {
  if (!G.inputs.build && !G.inputs.link && state.current) G.inputs.build = state.current;
  const buildSel = h("select", { id: "g-build", "aria-label": "Your build", onchange: (e) => { G.inputs.build = e.target.value; sync(); } },
    h("option", { value: "" }, "Pick from your PoB builds"),
    ...state.builds.map((b) => h("option", { value: b.path, selected: b.path === G.inputs.build }, (b.folder ? b.folder + " / " : "") + b.name)));
  const link = h("input", { id: "g-link", placeholder: "pobb.in/AbC123", "aria-label": "Your build as a pobb.in link", value: G.inputs.link });
  const guide = h("input", { id: "g-guide", placeholder: "pobb.in/AbC123", "aria-label": "Guide build link", value: G.inputs.guide });
  const errPlayer = h("p", { class: "ferror", role: "alert" }, str(errors.player));
  const errGuide = h("p", { class: "ferror", role: "alert" }, str(errors.guide));
  const go = h("button", { class: "primary", id: "g-go", onclick: startGuide }, "Compare");
  function sync() { go.disabled = !(G.inputs.guide.trim() && (G.inputs.link.trim() || G.inputs.build)); }
  const blur = (input, msgEl, text) => () => {
    const bad = input.value.trim() !== "" && !validLink(input.value);
    input.classList.toggle("invalid", bad); msgEl.textContent = bad ? text : "";
  };
  link.addEventListener("input", () => { G.inputs.link = link.value; sync(); });
  guide.addEventListener("input", () => { G.inputs.guide = guide.value; sync(); });
  link.addEventListener("blur", blur(link, errPlayer, "That is not a pobb.in build link."));
  guide.addEventListener("blur", blur(guide, errGuide, "That is not a pobb.in build link."));
  sync();
  $("main").replaceChildren(h("div", { class: "gview" }, h("h2", { class: "gtitle", tabindex: "-1" }, "Guide check"),
    h("p", { class: "lead" }, "Find what a guide build does differently, and test each difference on YOUR build with Path of Building."),
    h("div", { class: "gform" },
      h("label", {}, "Your build", buildSel), h("label", {}, "or paste your build as a pobb.in link", link), errPlayer,
      h("label", {}, "Guide build (pobb.in links only)", guide), errGuide,
      h("div", {}, go, " ", h("span", { class: "muted" },
        "Runs in Path of Building on your PC. No account needed. Takes up to about 90 seconds.")))));
}

async function startGuide() {
  const player = G.inputs.link.trim() ? { link: G.inputs.link.trim() } : { build: G.inputs.build };
  if (!validLink(G.inputs.guide)) { renderGuideInput({ guide: "That is not a pobb.in build link." }); return; }
  if (player.link && !validLink(player.link)) { renderGuideInput({ player: "That is not a pobb.in build link." }); return; }
  G.report = null; G.active = true; state.job = null;
  try {
    const res = await api("/api/guide-check", { player, guide: { link: G.inputs.guide.trim() } });
    G.job = res.jobId; G.running = true; G.started = Date.now();
    guidePoll(G.job);
  } catch (e) { G.running = false; renderGuideInput({ guide: e.message }); }
}

// ---- progress ------------------------------------------------------------------------------------
async function guidePoll(jobId) {
  if (!G.active || G.job !== jobId) return;
  let job;
  try { job = await api("/api/jobs/" + jobId); } catch (e) {
    G.running = false; renderGuidePanel({ error: "Lost contact with the app: " + e.message }, true); return;
  }
  if (!G.active || G.job !== jobId) return;
  if (job.status === "running") { updateProgress(job); setTimeout(() => guidePoll(jobId), POLL_MS); return; }
  G.running = false;
  if (job.status === "done" && job.report) renderGuideResult(job.report);
  else guideFailed(job);
}

function guideFailed(job) {
  const kind = str(job.errorKind);
  if (["BadLink", "Unreadable", "TooLarge"].includes(kind)) { renderGuideInput({ guide: str(job.error) }); return; }
  renderGuidePanel(job, kind !== "FetchFailed");
}

function stageList(job) {
  const started = arr(job.stages).length ? arr(job.stages) : (job.stage ? [job.stage] : []);
  const all = [...started, ...STAGES.filter((name) => !started.includes(name))];
  return all.map((name, i) => {
    const mode = i < started.length - 1 ? "done" : i === started.length - 1 ? "now" : "wait";
    const text = name === TESTING && mode === "now" && Number.isFinite(job.done) && Number.isFinite(job.total)
      ? `${name}: ${job.done} of ${job.total}` : name;
    const mark = mode === "done" ? "✓" : mode === "now" ? "●" : "○";
    const word = mode === "done" ? "done" : mode === "now" ? "in progress" : "waiting";
    return h("li", { class: mode }, h("span", { class: "mark", "aria-hidden": "true" }, mark), h("span", { class: "sr" }, word + ": "), text);
  });
}

function updateProgress(job) {
  if (!$("gprog")) {
    $("main").replaceChildren(h("div", { class: "progress gprogress", id: "gprog" }, h("h2", {}, "Guide check"),
      h("p", { id: "gname" }), h("ol", { class: "gstages", id: "gstages", "aria-live": "polite" }),
      h("div", { class: "bar", id: "gfillbar", role: "progressbar", "aria-label": "Testing differences", "aria-valuemin": "0", "aria-valuemax": "100" }, h("span")),
      h("p", { class: "muted", id: "gtime" }), h("p", { class: "muted", id: "gslow" })));
  }
  $("gname").textContent = str(job.build);
  const sig = JSON.stringify([job.stages, job.stage, job.done, job.total]);
  if ($("gstages").dataset.sig !== sig) { $("gstages").replaceChildren(...stageList(job)); $("gstages").dataset.sig = sig; }
  const bar = $("gfillbar"), det = job.stage === TESTING && fin(job.total) > 0 && Number.isFinite(job.done);
  bar.classList.toggle("det", det);
  if (det) {
    const pct = Math.min(100, Math.floor(100 * job.done / job.total));
    bar.firstChild.style.width = pct + "%"; bar.setAttribute("aria-valuenow", String(pct));
  } else bar.removeAttribute("aria-valuenow");
  const secs = Math.max(0, Math.floor((Date.now() - G.started) / 1000));
  $("gtime").textContent = `Elapsed ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  $("gslow").textContent = secs >= SLOW_AFTER_S ? "Big builds take longer." : "";
}

function renderGuidePanel(job, isCheckFailure) {
  const id = str(job.referenceId);
  const text = isCheckFailure ? str(job.error) || "The check failed."
    : (str(job.error) || "Couldn’t fetch the guide.") + " Try again later. Your build was not touched.";

  const panel = h("div", { class: "alert gpanel", tabindex: "-1", role: "alert" }, h("div", { class: "title" }, text),

// ---- result ----------------------------------------------------------------------------------------
function headerStrip(report) {
  const hd = obj(report.header), pts = obj(hd.points);
  const parts = [`Your build: ${str(hd.playerName)}`, `Guide: ${str(hd.guideName)}`];
  if (str(hd.pobVersion)) parts.push("PoB " + hd.pobVersion);
  if (str(hd.league)) parts.push("League " + hd.league + (str(hd.leagueDate) ? ` (data ${hd.leagueDate})` : ""));
  if (Number.isFinite(pts.used) && Number.isFinite(pts.available)) parts.push(`Points ${pts.used} of ${pts.available}`);
  return h("p", { class: "gstrip" }, parts.join(" | "));
}

function summaryLine(report) {
  const c = obj(report.counts), rows = arr(report.rows);
  const has = (chip) => rows.filter((r) => arr(obj(r).chips).includes(chip)).length;
  const found = Number.isFinite(c.found) ? c.found : rows.length + arr(report.noChange).length + arr(report.notTested).length;
  const tested = Number.isFinite(c.tested) ? c.tested : rows.length + arr(report.noChange).length;
  const nt = Number.isFinite(c.notTested) ? c.notTested : arr(report.notTested).length;
  return `${plural(found, "difference")} found - ${tested} tested - ${has("helps")} help - ${plural(has("trade-off"), "trade-off")} - ${nt} not tested`;

function detailLines(row) {
  const info = obj(row.info), cat = row.category, d = obj(obj(row.result).delta), out = [];
  const add = (t) => { if (str(t)) out.push(t); };
  add(row.detail); add(row.note);
  if (cat === "tree-add" && Number.isFinite(info.points)) {
    const per = info.points > 0 && Number.isFinite(d.dpsPct) ? ` - ${gPct(d.dpsPct / info.points)} DPS per point` : "";
    add(`Costs ${plural(info.points, "point")}${fin(info.pathNodes) > 0 ? ` (includes ${plural(info.pathNodes, "path node")})` : ""}${per}`);
  }
  if (cat === "tree-remove" && Number.isFinite(info.refund)) {
    const also = arr(info.alsoRemoves).map(String);
    add(`Refunds ${plural(info.refund, "point")}${also.length ? "; also removes: " + also.join(", ") : ""}`);
  }
  if (cat === "item" && str(info.toItem))
    add(`Replaces your ${str(info.slot)}: ${str(info.fromItem) || "nothing"} -> ${info.toItem}. Tested as the whole item.`);
  if (GEAR.includes(cat)) add("Price: " + (typeof row.price === "string" && row.price ? row.price : "price unknown"));
  const avail = obj(row.availability);
  if (str(avail.text) && avail.state !== "n/a") add("Availability: " + avail.text);
  return out;
}

function tradeoffLine(row) {
  const d = obj(obj(row.result).delta);
  if (!arr(row.chips).includes("trade-off")) return null;
  const gain = [["DPS", d.dpsPct], ["EHP", d.ehpPct]].filter(([, v]) => Number.isFinite(v) && v > ZERO_PCT);
  const cost = [["DPS", d.dpsPct], ["EHP", d.ehpPct]].filter(([, v]) => Number.isFinite(v) && v < -ZERO_PCT);
  const fmt = (list) => list.map(([k, v]) => `${k} ${gPct(v)}`).join(", ");
  return (gain.length ? `Gains ${fmt(gain)}; ` : "") + (cost.length ? `costs ${fmt(cost)}` : "");

function interactionLine(row) {
  const it = row.interaction;
  if (!it || typeof it !== "object") return "Interaction: none known";
  const refs = arr(it.vaultRefs).map(String);
  return "Interaction: " + str(it.note) + (refs.length ? ` (vault: ${refs.join(", ")})` : "");

function numLine(label, tip, delta, from, to, o) {

  return h("div", { class: "nrow" }, h("span", { class: "nlabel", title: tip }, label),

    h("span", { class: "nfrom" }, `(${o.big(from)} -> ${o.big(to)})`));
}

function numbersCell(row) {
  const res = obj(row.result), d = obj(res.delta), b = obj(res.base), a = obj(res.after);
  const key = G.sort === "dps" ? "dps" : G.sort === "ehp" ? "ehp" : fin(d.dpsPct) >= fin(d.ehpPct) ? "dps" : "ehp";
  return h("div", { class: "gnums" },
    numLine("DPS", TIP.dps, d.dpsPct, b.dps, a.dps, { fmt: gPct, big: gBig, zero: ZERO_PCT, strong: key === "dps" }),
    numLine("EHP", TIP.ehp, d.ehpPct, b.ehp, a.ehp, { fmt: gPct, big: gBig, zero: ZERO_PCT, strong: key === "ehp" }),
    numLine("Mana/s", TIP.mana, d.manaMargin, b.manaMargin, a.manaMargin, { fmt: gMargin, big: gPlain, zero: ZERO_PCT }));

function breakdownEl(row) {

function chipEls(chips) {

}

function guideRow(row) {
  row = obj(row);
  const id = str(row.id), locked = row.locked === true || row.tickable === false, reason = str(row.lockReason);
  const label = str(row.label);

    obj(row.conditional).text, row.zeroNote,

function orderedRows() {
  const rows = arr(G.report.rows).map(obj), byId = new Map(rows.map((r) => [r.id, r]));
  const order = arr(obj(G.report.sorts)[G.sort]);
  const sorted = order.map((id) => byId.get(id)).filter(Boolean);

function groupTools() {
  const sorts = [["best", "Biggest gain"], ["dps", "DPS"], ["ehp", "EHP"]];
  return h("div", { class: "gtools" }, h("span", {}, "Sort by:"),
    ...sorts.map(([k, text]) => h("label", { title: k === "best" ? TIP.best : null },
      h("input", { type: "radio", name: "gsort", value: k, checked: G.sort === k, onchange: () => { G.sort = k; renderGroupA(); } }), text)),

    ...["all", "Gear", "Tree", "Gems & supports"].map((k) => h("button", { class: "chip gfilter", "aria-pressed": String(G.filter === k),

function groupBox(title, count, open, ...body) {

}

function renderGroupA() {
  G.rowEls.clear(); G.boxes.clear();
  const rep = G.report, shown = orderedRows(), all = arr(rep.rows), flat = arr(rep.noChange);
  const msg = rep.state === "differences" && !all.length && !flat.length ? "None of the tested differences improve your build." : null;
  const open = G.groupA ? G.groupA.open : true;
  const box = groupBox("Differences, ranked", all.length + flat.length, open, groupTools(),
    G.filter !== "all" ? h("p", { class: "intro" }, `Showing ${shown.length} of ${all.length}.`) : null,
    msg ? h("p", { class: "muted" }, msg) : null,
    h("ul", { class: "glist", "aria-label": "Differences, ranked" }, shown.map(guideRow)),
    flat.length ? h("details", { class: "ggroup" }, h("summary", {}, `No change in PoB (${flat.length})`),
      h("div", { class: "ggroup-body" }, h("ul", { class: "glist", "aria-label": "No change in PoB" }, flat.map(guideRow)))) : null);
  if (G.groupA && G.groupA.isConnected) G.groupA.replaceWith(box);
  G.groupA = box; G.groups.a = box;
  return box;
}

function configRows(rows) {
  if (!rows.length) return h("p", { class: "muted" }, "The guide sets no extra conditions.");
  return h("ul", { class: "glist" }, rows.map((r) => {
    r = obj(r);
    const d = obj(obj(r.result).delta);
    const shown = r.result ? `If on, PoB shows: DPS ${gPct(d.dpsPct)}  EHP ${gPct(d.ehpPct)}` : "Not tested";
    return h("li", {}, h("div", { class: "row grow" }, h("span"), h("div", {}, h("div", { class: "title" }, str(r.label)),
      h("div", { class: "detail" }, str(r.detail) ? h("div", {}, r.detail) : null, h("div", {}, "Only if this applies to you in game."))),
      h("div", { class: "gnums" }, shown)));
  }));
}

function notTestedRows(rows) {
  if (!rows.length) return h("p", { class: "muted" }, "Nothing was left untested.");
  const byReason = new Map();
  for (const r of rows.map(obj)) { const k = str(r.reason) || "Not testable"; byReason.set(k, [...(byReason.get(k) || []), r]); }
  return [...byReason].map(([reason, list]) => h("div", {}, h("div", { class: "group-title" }, reason),
    h("ul", { class: "glist" }, list.map((r) => h("li", {}, h("div", { class: "row grow" }, h("span"),
      h("div", {}, h("div", { class: "title" }, str(r.label), " ", h("span", { class: "chip" }, "not tested"), ...chipEls(arr(r.chips).filter((c) => c !== "not tested"))),
        str(r.detail) ? h("div", { class: "detail" }, r.detail) : null)))))));
}

function renderGuideResult(report) {
  Object.assign(G, { report, ticked: new Set(), saved: null, preview: null, bar: "idle", saving: false, last: null,
    sort: "best", filter: "all", groupA: null, seq: G.seq + 1 });
  G.rowMsg.clear();
  const rep = obj(report), st = str(rep.state), config = arr(rep.config), nt = arr(rep.notTested);
  const title = h("h2", { class: "gtitle", tabindex: "-1" }, "Guide check");
  const parts = [title, headerStrip(rep), ...arr(obj(rep.header).banners).map((b) => h("div", { class: "gbanner" }, str(obj(b).text))),
    h("div", { class: "gsummary" }, summaryLine(rep))];
  if (st === "identical") parts.push(h("p", {}, "Both builds are the same."));
  else {
    parts.push(st === "nothingTestable" ? groupBox("Differences, ranked", 0, true, h("p", { class: "muted" }, "No differences to test.")) : renderGroupA());
    G.groups.b = groupBox("Settings the guide assumes", config.length, false,
      h("p", { class: "intro" }, "These are Path of Building settings the guide author turned on. They inflate the guide’s numbers if they don’t apply to you in game. They are never changed in your build."),
      configRows(config));
    parts.push(G.groups.b);
  }
  G.groups.c = groupBox("Not tested", nt.length, false,
    h("p", { class: "intro" }, "Found, but not tested, so no number. Path of Building can’t judge these one at a time, or this check doesn’t cover them yet."),
    notTestedRows(nt));
  G.barEl = h("div", { class: "gbar", id: "gsavebar" });
  parts.push(G.groups.c, h("button", { class: "ghost", onclick: () => { G.report = null; renderGuideInput({}); } }, "Check another guide"), G.barEl);
  $("main").replaceChildren(...parts);
  renderBar(); title.focus();
}

// ---- ticks, combined prediction, save --------------------------------------------------------------
function onTick(id, on) {
  if (on) G.ticked.add(id); else G.ticked.delete(id);
  G.last = on ? id : null; G.saved = null;
  for (const key of [...G.rowMsg.keys()]) setRowMsg(key, "");
  schedulePreview();
}

function setRowMsg(id, text) {
  if (text) G.rowMsg.set(id, text); else G.rowMsg.delete(id);
  const el = G.rowEls.get(id);
  if (el) el.textContent = text;
}

function schedulePreview() {
  clearTimeout(G.timer);
  const seq = ++G.seq;
  G.preview = null; G.bar = G.ticked.size ? "checking" : "idle";
  renderBar();
  if (G.ticked.size) G.timer = setTimeout(() => runPreview(seq), PREVIEW_DELAY_MS);
}

async function runPreview(seq) {
  try {
    const out = await api("/api/guide-preview", { jobId: G.job, ids: [...G.ticked] });
    if (seq === G.seq && G.active) gotPreview(out);
  } catch (e) { if (seq === G.seq) barFailed(e); }
}

function gotPreview(out) {
  out = obj(out);
  const conflicts = arr(out.conflicts).map(obj);
  const mine = conflicts.find((c) => arr(c.ids).includes(G.last));
  for (const c of conflicts) for (const id of arr(c.ids)) if (!mine || id === G.last) setRowMsg(id, str(c.message));
  if (mine && G.last) {
    G.ticked.delete(G.last);
    const box = G.boxes.get(G.last); if (box) box.checked = false;
    G.last = null; schedulePreview(); return;
  }
  G.preview = out; G.bar = out.ok === true ? "ok" : "refused";
  renderBar();
}

function barFailed(e) {
  G.bar = e.status === 409 ? "stale" : "error"; G.preview = { message: e.message }; G.saving = false;
  renderBar();
}

function barMetrics(out) {
  const c = obj(out.combined), d = obj(c.delta), pts = obj(out.points);
  if (!out.combined) return h("div", {}, "Combined effect is checked when you save.");
  return h("div", {}, h("span", { class: "m", title: TIP.dps }, "DPS " + gPct(d.dpsPct)), h("span", { class: "m", title: TIP.ehp }, "EHP " + gPct(d.ehpPct)),
    h("span", { class: "m", title: TIP.mana }, "Mana margin " + gMargin(d.manaMargin)), h("span", { class: "muted" }, "(all ticked together)"),
    Number.isFinite(pts.after) && Number.isFinite(pts.available) ? h("span", { class: "m muted" }, ` Points ${pts.after} of ${pts.available}`) : null);
}

function barLines() {
  const n = G.ticked.size, out = obj(G.preview), r = obj(out.refused);
  if (G.bar === "stale") return [h("div", {}, "Your build changed since the check; run it again.")];
  if (G.bar === "error") return [h("div", { class: "warn" }, str(out.message) || "Couldn’t check the ticked changes.")];
  if (!n) return [h("div", { class: "muted" }, "0 ticked. Tick the changes you want.")];
  const head = h("div", {}, plural(n, "change") + " ticked");
  if (G.bar === "checking") return [head, h("div", { class: "muted" }, "Checking the combined effect…")];
  if (G.bar === "refused") {
    const why = r.reason === "rule" ? "Breaks a rule: " + arr(out.violations).map(String).join("; ")
      : r.reason === "pob" ? "Path of Building couldn’t check this set: " + str(r.message) : str(r.message);
    return [head, h("div", { class: "warn" }, why), out.combined ? barMetrics(out) : null];
  }
  return [head, barMetrics(out)];
}

function renderBar() {
  const bar = G.barEl;
  if (!bar) return;
  bar.classList.toggle("amber", G.bar === "stale");
  if (G.saved) { bar.replaceChildren(...savedNodes(obj(G.saved))); return; }
  const action = G.bar === "stale" ? h("button", { class: "primary", onclick: startGuide }, "Run again")
    : h("button", { class: "primary", disabled: G.bar !== "ok" || G.saving, onclick: saveCopy }, G.saving ? "Saving…" : "Save fixed copy");
  bar.replaceChildren(h("div", { class: "gbar-text", "aria-live": "polite" }, ...barLines()), action);
}

async function saveCopy() {
  G.saving = true; renderBar();
  try {
    const out = obj(await api("/api/guide-apply", { jobId: G.job, ids: [...G.ticked] }));
    G.saving = false;
    if (out.saved === true) G.saved = out;
    else { G.preview = { ...out, message: "Nothing was saved." }; G.bar = out.refused ? "refused" : "error"; }
    renderBar();
  } catch (e) { barFailed(e); }
}

function jump(group) {
  const el = G.groups[group];
  if (!el) return;
  el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function notAppliedLine(na) {
  const parts = [["settings the guide assumes", na.config, "b"], ["not tested", na.notTested, "c"], ["not obtainable", na.unobtainable, "a"],
    ["blocked by a rule", na.locked, "a"], ["unticked", na.unticked, "a"]];
  const nodes = [];
  parts.forEach(([text, n, g], i) => {
    nodes.push(i ? ", " : "Not applied: ", h("button", { class: "linkbtn", onclick: () => jump(g) }, `${fin(n)} ${text}`));
  });
  return h("div", {}, ...nodes, ".");
}

function reloadLine(rl) {
  if (!rl || rl.checked !== true) return h("div", { class: "warn" }, "The saved copy was not re-checked in Path of Building.");
  if (str(rl.error)) return h("div", { class: "warn" }, "The re-check could not run: " + rl.error);
  if (rl.equal === true) return h("div", {}, "Re-checked in Path of Building: the saved copy matches the prediction.");
  return h("div", { class: "warn" }, "The saved copy differs from the prediction: " + arr(rl.diffs).map(String).join("; "));
}

function savedNodes(out) {
  const ap = obj(out.applied), n = fin(ap.count);
  return [h("div", { class: "gbar-text", "aria-live": "polite" },
    h("div", {}, "Saved: ", h("code", {}, str(out.path) || str(out.fileName)), ". Your original was not changed."),
    h("div", {}, `Applied: ${plural(n, "change")}.`), notAppliedLine(obj(out.notApplied)), reloadLine(out.reload),
    h("div", { class: "muted" }, "Open it in Path of Building to check; the numbers should match within rounding.")),
  h("button", { class: "ghost", onclick: () => { G.saved = null; schedulePreview(); } }, "Back to the list")];
}

$("gnav").addEventListener("click", openGuide);

$("search").addEventListener("input", renderBuilds);
$("rerun").addEventListener("click", () => state.current && startAudit(state.current));
loadBuilds().catch((e) => renderError(e.message));
</script>
</body>
